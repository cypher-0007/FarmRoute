<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Paystack Payment UI</title>

    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <!-- Paystack -->

    <script src="https://js.paystack.co/v1/inline.js"></script>

</head>



<body
class="bg-gradient-to-br from-indigo-100 via-white to-purple-100 min-h-screen flex items-center justify-center px-6 py-10">

    <!-- PAYMENT CARD -->

    <div
    class="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- TOP -->

        <div
        class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-white text-center">

            <div
            class="w-20 h-20 mx-auto rounded-full bg-white/20 flex items-center justify-center text-4xl mb-5">

                <i class="fa-solid fa-credit-card"></i>

            </div>

            <h1
            class="text-4xl font-bold">

                Secure Payment

            </h1>

            <p
            class="mt-3 text-indigo-100">

                Fast & secure payments powered by Paystack

            </p>

        </div>


        <!-- FORM -->

        <form
        id="paymentForm"
        class="p-8 space-y-6">

            <!-- NAME -->

            <div>

                <label
                class="font-semibold text-gray-700">

                    Full Name

                </label>

                <div class="relative mt-2">

                    <span
                    class="absolute left-4 top-4 text-gray-400">

                        <i class="fa-solid fa-user"></i>

                    </span>

                    <input
                    type="text"
                    id="name"
                    required
                    placeholder="John Doe"
                    class="w-full border border-gray-300 rounded-xl pl-12 pr-4 py-4 outline-none focus:ring-2 focus:ring-indigo-500">

                </div>

            </div>


            <!-- EMAIL -->

            <div>

                <label
                class="font-semibold text-gray-700">

                    Email Address

                </label>

                <div class="relative mt-2">

                    <span
                    class="absolute left-4 top-4 text-gray-400">

                        <i class="fa-solid fa-envelope"></i>

                    </span>

                    <input
                    type="email"
                    id="email"
                    required
                    placeholder="example@email.com"
                    class="w-full border border-gray-300 rounded-xl pl-12 pr-4 py-4 outline-none focus:ring-2 focus:ring-indigo-500">

                </div>

            </div>


            <!-- AMOUNT -->

            <div>

                <label
                class="font-semibold text-gray-700">

                    Amount (₦)

                </label>

                <div class="relative mt-2">

                    <span
                    class="absolute left-4 top-4 text-gray-400 font-bold">

                        ₦

                    </span>

                    <input
                    type="number"
                    id="amount"
                    required
                    placeholder="5000"
                    class="w-full border border-gray-300 rounded-xl pl-12 pr-4 py-4 outline-none focus:ring-2 focus:ring-indigo-500">

                </div>

            </div>


            <!-- PAYMENT BUTTON -->

            <button
            type="submit"
            id="payBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold text-lg transition duration-300 flex items-center justify-center gap-3">

                <i class="fa-solid fa-lock"></i>

                Pay Now

            </button>

        </form>

    </div>


    <!-- SUCCESS MODAL -->

    <div
    id="successModal"
    class="hidden fixed inset-0 bg-black/60 flex items-center justify-center px-6 z-50">

        <div
        class="bg-white rounded-3xl p-10 text-center max-w-md w-full">

            <div
            class="w-24 h-24 mx-auto rounded-full bg-green-100 flex items-center justify-center text-green-600 text-5xl mb-6">

                <i class="fa-solid fa-check"></i>

            </div>

            <h2
            class="text-3xl font-bold mb-4">

                Payment Successful

            </h2>

            <p
            class="text-gray-600 mb-6">

                Your payment was completed successfully.

            </p>

            <button
            id="closeModal"
            class="bg-indigo-600 text-white px-8 py-3 rounded-xl hover:bg-indigo-700">

                Continue

            </button>

        </div>

    </div>


    


</body>
</html>
